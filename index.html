    --ink:#f2f1ec;
    --ink-dim:#8b8e97;
    --glow-red:rgba(239,59,74,0.5);
    --glow-blue:rgba(59,123,255,0.5);
    --font-pixel:'Press Start 2P', monospace;
    --hex: polygon(6% 0%, 94% 0%, 100% 50%, 94% 100%, 6% 100%, 0% 50%);
    --ship:#7a8290;
    --ship-dark:#4b5160;
    --laser:#bff3ff;
    --gold:#ffcf3f;
    --gold-shine:#fff6d0;
    --gold-shadow:#e0930f;
    --coin-outline:#120d00;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  body{
    background: radial-gradient(circle at 50% 20%, var(--arena-1), var(--arena-0) 70%);
    color: var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }

  .stage-wrap{
    position:relative;
    width:100%;
    max-width:430px;
    height:100vh;
    max-height:900px;
    padding:14px;
  }

  .phone{
    position:relative;
    width:100%;
    height:100%;
    border-radius:34px;
    overflow:hidden;
    background: linear-gradient(180deg, var(--arena-1) 0%, var(--arena-0) 55%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 30px 80px -20px rgba(0,0,0,0.7),
      inset 0 0 0 1px rgba(255,255,255,0.03);
  }

  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  .scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow: inset 0 0 90px 30px rgba(0,0,0,0.6);
  }

  .flash{
    position:absolute;
    inset:0;
    pointer-events:none;
    background: var(--warn);
    opacity:0;
  }

  .hud{
    position:absolute;
    top:0; left:0; right:0;
    padding: max(18px, env(safe-area-inset-top)) 14px 0;
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    pointer-events:none;
  }

  .score{
    position:absolute;
    top: max(18px, env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    font-family: var(--font-pixel);
    font-size: 54px;
    line-height:1;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.6);
  }

  .hud-stack{
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:flex-start;
    margin-top:66px;
  }

  .best-pill, .coin-pill{
    display:flex;
    align-items:center;
    gap:10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 17px;
    font-weight:600;
    color: var(--ink-dim);
    backdrop-filter: blur(6px);
  }
  .best-pill b{ font-family:var(--font-pixel); font-size:19px; color: var(--ink); font-weight:400; }
  .coin-pill b{ font-family:var(--font-pixel); font-size:19px; color: var(--gold); font-weight:400; }
  .coin-icon{ width:34px; height:28px; flex-shrink:0; }
  .coin-icon .outline{ fill:var(--coin-outline); }
  .coin-icon .gold{ fill:var(--gold); }
  .coin-icon .shine{ fill:var(--gold-shine); }
  .coin-icon .shadow{ fill:var(--gold-shadow); }
  .coin-pill.pop{ animation: coinPop .3s ease; }
  @keyframes coinPop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }

  .pressure-banner{
    position:absolute;
    top:78px;
    left:50%;
    transform: translateX(-50%) translateY(-10px);
    font-family: var(--font-pixel);
    font-size:9px;
    letter-spacing:1px;
    color: var(--warn);
    background: rgba(255,176,32,0.14);
    border:1px solid rgba(255,176,32,0.4);
    padding:8px 12px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .pressure-banner.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding: 40px 32px;
    text-align:center;
    background: radial-gradient(circle at 50% 20%, var(--arena-1), var(--arena-0) 70%);
    transition: opacity .35s ease, visibility .35s ease;
  }
  .screen[hidden]{ display:none; }
  .screen.leaving{ opacity:0; pointer-events:none; }

  .logo{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin:-16px 0 0;
  }
  .logo-line{
    font-family: var(--font-pixel);
    font-size: clamp(36px, 13vw, 58px);
    line-height:1.3;
    text-wrap: balance;
  }
  .logo-red{ color:var(--red); text-shadow:4px 4px 0 var(--red-dark); }
  .logo-blue{ color:var(--blue); text-shadow:4px 4px 0 var(--blue-dark); }

  .logo-badge{
    font-family: var(--font-pixel);
    font-size:12px;
    letter-spacing:3px;
    color: var(--ink-dim);
    margin:-4px 0 0;
  }

  .ball-mark{
    width:44px;
    height:44px;
    animation: floaty 2.6s ease-in-out infinite;
  }
  .ball-mark .r{ fill:var(--red); }
  .ball-mark .b{ fill:var(--blue); }

  .ship-deco{
    position:absolute;
    width:68px;
    height:63px;
    pointer-events:none;
  }
  .ship-tilt{
    width:100%;
    height:100%;
    transform-origin:50% 60%;
  }
  .ship-deco .hull{ fill:var(--ship); }
  .ship-deco .hull-dark{ fill:var(--ship-dark); }
  .ship-deco .cockpit{ fill:var(--blue-light); }
  .ship-deco .engine{ fill:var(--laser); }
  .ship-deco .accent{ fill:var(--red); }
  .ship-right-1{ right:0px; top:6%; }
  .ship-right-1 .ship-tilt{ transform:rotate(-14deg); }
  .ship-right-2{ right:0px; top:50%; }
  .ship-right-2 .ship-tilt{ transform:rotate(11deg); }
  .ship-left-1{ left:0px; top:10%; }
  .ship-left-1 .ship-tilt{ transform:rotate(18deg); }
  .ship-left-2{ left:0px; top:54%; }
  .ship-left-2 .ship-tilt{ transform:rotate(-8deg); }

  .ship-bolt{
    position:absolute;
    left:50%;
    bottom:100%;
    width:2px;
    height:7px;
    margin-left:-1px;
    background:var(--laser);
    box-shadow:0 0 4px var(--laser);
    opacity:0;
    animation: shoot 1.6s ease-out infinite;
  }
  @keyframes shoot{
    0%{ transform:translateY(0); opacity:0; }
    8%{ opacity:1; }
    68%{ opacity:1; }
    100%{ transform:translateY(-46px); opacity:0; }
  }

  .lede{
    font-size:14px;
    line-height:1.6;
    color: var(--ink-dim);
    max-width:270px;
    margin:0;
  }
  .lede em{
    color:var(--ink);
    font-style:normal;
    font-weight:700;
  }

  .menu-coins{
    display:flex;
    align-items:center;
    gap:8px;
    margin:-2px 0 0;
    font-family: var(--font-pixel);
    font-size:13px;
    color: var(--gold);
  }

  .btn-group{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .arcade-btn.secondary::after{ background: var(--ship-dark); }
  .arcade-btn.secondary .arcade-btn-face{
    background: linear-gradient(180deg, var(--ship), var(--ship-dark) 65%);
  }
  .arcade-btn.secondary .arcade-btn-label{ text-shadow: 2px 2px 0 var(--ship-dark); }

  .skins-title{
    font-family: var(--font-pixel);
    font-size: clamp(28px, 10vw, 40px);
    color: var(--ink);
    text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
    margin:0;
  }

  .skin-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    max-width:300px;
  }

  .skin-card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius:16px;
    padding:12px 16px;
    cursor:pointer;
    pointer-events:auto;
  }
  .skin-card.selected{
    border-color: var(--gold);
    background: rgba(255,207,63,0.1);
  }
  .skin-card.denied{ animation: cardDenied .3s ease; }
  @keyframes cardDenied{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }

  .skin-swatch{
    position:static;
    inset:auto;
    display:block;
    width:52px;
    height:52px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow: 0 0 10px rgba(255,255,255,0.15);
    image-rendering: pixelated;
  }

  .skin-name{
    font-family: var(--font-pixel);
    font-size:13px;
    color: var(--ink);
    flex:1;
    text-align:left;
  }

  .skin-price{
    display:flex;
    align-items:center;
    gap:6px;
    font-family: var(--font-pixel);
    font-size:13px;
    color: var(--gold);
    flex-shrink:0;
  }
  .skin-price .coin-icon{ width:18px; height:15px; }
  .skin-status{
    font-family: var(--font-pixel);
    font-size:11px;
    color: var(--ink-dim);
    flex-shrink:0;
  }
  .skin-card.selected .skin-status{ color: var(--gold); }

  @keyframes floaty{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }

  .arcade-btn{
    position:relative;
    border:none;
    cursor:pointer;
    background: var(--cream);
    clip-path: var(--hex);
    padding:6px;
    display:inline-block;
    transition: transform .08s ease;
  }
  .arcade-btn::after{
    content:"";
    position:absolute;
    inset:0;
    clip-path: var(--hex);
    background: var(--red-dark);
    transform: translate(6px, 7px);
    z-index:-1;
    transition: opacity .08s ease;
  }
  .arcade-btn:active{ transform: translate(5px, 6px); }
  .arcade-btn.large:active{ transform: translate(6px, 7px); }
  .arcade-btn:active::after{ opacity:0; }

  .arcade-btn-face{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:13px 24px;
    min-width:168px;
    clip-path: var(--hex);
    background: linear-gradient(180deg, var(--red-light), var(--red) 65%);
    overflow:hidden;
  }

  .arcade-btn-face::before{
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0 2px, transparent 2px 6px);
    pointer-events:none;
  }
  .arcade-btn-label{
    position:relative;
    font-family: var(--font-pixel);
    font-size:13px;
    color: var(--cream);
    text-shadow: 2px 2px 0 var(--red-dark);
    letter-spacing:1px;
    white-space:nowrap;
  }

  .arcade-btn.large{ padding:8px; }
  .arcade-btn.large .arcade-btn-face{ padding: clamp(14px,4.5vw,22px) clamp(20px,7vw,38px); }
  .arcade-btn.large .arcade-btn-label{ font-size: clamp(13px,4vw,18px); }
  .arcade-btn.large::after{ transform: translate(7px, 8px); }

  .over-title{
    font-family: var(--font-pixel);
    font-size: clamp(38px, 17vw, 64px);
    color: var(--warn);
    text-shadow: 3px 3px 0 var(--warn-dark);
    margin:0;
    text-wrap:balance;
  }

  .result-score{
    font-family: var(--font-pixel);
    font-size:52px;
    line-height:1.3;
    color: var(--gold);
    text-shadow: 4px 4px 0 rgba(0,0,0,0.6);
    margin:14px 0 0;
  }
  .result-best{
    font-family: var(--font-pixel);
    font-size:16px;
    letter-spacing:1px;
    color: var(--ink);
    margin:0;
  }
  .result-best b{ color:var(--gold); font-weight:400; }
  .new-best{
    display:inline-block;
    margin-inline-start:10px;
    font-family: var(--font-pixel);
    font-size:10px;
    letter-spacing:1px;
    color:#1a1200;
    background:var(--warn);
    padding:5px 8px;
  }
  .new-best[hidden]{ display:none; }

  @media (prefers-reduced-motion: reduce){
    .ball-mark{ animation:none; }
    .screen{ transition:none; }
    .arcade-btn, .arcade-btn::after{ transition:none; }
    .ship-bolt{ animation:none; opacity:0; }
    .coin-pill.pop{ animation:none; }
    .skin-card.denied{ animation:none; }
  }
</style>

  function resize(){
    var rect = phone.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 3);

    H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var SPEED_BASE = 175, SPEED_PLATEAU = 320, SPEED_MAX = 550;
  var SPEED_RAMP1_END = 16, SPEED_PLATEAU_END = 25, SPEED_RAMP2_RATE = 8;

  function speedForScore(s){
    if (s <= SPEED_RAMP1_END) {
      return SPEED_BASE + (SPEED_PLATEAU - SPEED_BASE) * (s / SPEED_RAMP1_END);
    }
    if (s <= SPEED_PLATEAU_END) {
      return SPEED_PLATEAU;
    }
    return Math.min(SPEED_MAX, SPEED_PLATEAU + (s - SPEED_PLATEAU_END) * SPEED_RAMP2_RATE);
  }

  function randInt(a, b){ return Math.floor(rand(a, b + 1)); }

  function buildBasketballPixels(){
    var octx = basketballPixelOrange.getContext('2d');
    octx.imageSmoothingEnabled = true;
    octx.drawImage(basketballImg, 0, 0, BB_PIX, BB_PIX);

    var bctx = basketballPixelBlack.getContext('2d');
    var srcData = octx.getImageData(0, 0, BB_PIX, BB_PIX);
    var dstData = bctx.createImageData(BB_PIX, BB_PIX);

    var lumMin = 1, lumMax = 0;
    for (var p = 0; p < srcData.data.length; p += 4) {
      if (srcData.data[p + 3] < 10) continue;
      var l = (srcData.data[p] * 0.299 + srcData.data[p + 1] * 0.587 + srcData.data[p + 2] * 0.114) / 255;
      if (l < lumMin) lumMin = l;
      if (l > lumMax) lumMax = l;
    }
    var lumRange = Math.max(0.05, lumMax - lumMin);

    for (var i = 0; i < srcData.data.length; i += 4) {
      var a = srcData.data[i + 3];
      if (a < 10) { dstData.data[i + 3] = 0; continue; }
      var lum = (srcData.data[i] * 0.299 + srcData.data[i + 1] * 0.587 + srcData.data[i + 2] * 0.114) / 255;
      var norm = Math.max(0, Math.min(1, (lum - lumMin) / lumRange));
      var curved = Math.pow(norm, 0.8);
      var shade = Math.round(10 + curved * 195);
      dstData.data[i] = shade;
      dstData.data[i + 1] = shade;
      dstData.data[i + 2] = Math.min(255, shade + 10);
      dstData.data[i + 3] = a;
    }
    bctx.putImageData(dstData, 0, 0);
    basketballPixelsReady = true;
  }

  function buildCreeperFaceCanvas(baseHex){
    var c = document.createElement('canvas');
    c.width = CREEPER_PIX;

    var base = hexToRgb(baseHex);
    for (var row = 0; row < CREEPER_PIX; row++) {

      var rowLight = band === 0 ? 1.25 : (band === 1 ? 1 : 0.78);

        } else {
          r = Math.min(255, Math.round(base.r * rowLight));
          g = Math.min(255, Math.round(base.g * rowLight));
          b = Math.min(255, Math.round(base.b * rowLight));
        }

        cx.fillRect(col, row, 1, 1);

  function hexToRgb(hex){
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];

    var s = 52;

      pctx.clip();
      pctx.drawImage(basketballPixelBlack, -r, -r, r * 2, r * 2);
      pctx.restore();

      pctx.drawImage(creeperPixelBlue, -r, -r, r * 2, r * 2);

          applySkin(skin);
          playPass();
          renderSkinList();
        } else {
          card.classList.remove('denied');
          void card.offsetWidth;
          card.classList.add('denied');
        }
      });
      skinList.appendChild(card);
    });
  }

  // ---------- audio ----------
  var actx = null;
  function ensureAudio(){
    if (!actx) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq0, freq1, dur, type, peak){
    if (!actx) return;
    var t0 = actx.currentTime;
    var osc = actx.createOscillator();
    var gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq0, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq1), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.02, dur * 0.3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function playSwitch(){ tone(900, 1200, 0.05, 'square', 0.06); }
  function playPass(){ tone(620, 980, 0.11, 'sine', 0.12); }
  function playFail(){
    if (!actx) return;
    tone(260, 70, 0.32, 'sawtooth', 0.14);
    var t0 = actx.currentTime;
    var bufSize = actx.sampleRate * 0.18;
    var buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    var noise = actx.createBufferSource();
    noise.buffer = buf;
    var ng = actx.createGain();
    ng.gain.setValueAtTime(0.18, t0);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    noise.connect(ng).connect(actx.destination);
    noise.start(t0);
  }

  // ---------- game state ----------
  var STATE_START = 0, STATE_PLAY = 1, STATE_OVER = 2;
  var state = STATE_START;

  var ball = { x: 0, vx: 0, color: RED, switchT: 1, radius: 16 };
  var barriers = [];
  var bgStreaks = [];
  var scrollOffset, elapsed, score, speed;
  var stormGroupsLeft, stormNextScore;
  var lastBarrierColor = null;
  var shakeT, flashT, lastTs;

  function ballScreenY(){ return H * 0.32; }

  function spawnGroup(fromWorldY){
    var t = clamp(elapsed / 55, 0, 1);
    var groupGap = lerp(260, 150, t);
    var lineGap = lerp(140, 78, t);

    var storming = stormGroupsLeft > 0;
    var numLines;
    if (storming) {
      numLines = 3;
      stormGroupsLeft--;
    } else {
      var r = Math.random();
      var hi = lerp(0.25, 0.55, t);
      var mid = lerp(0.55, 0.32, t);
      if (r < hi) numLines = 3;
      else if (r < hi + mid) numLines = 2;
      else numLines = 1;
    }

    var y = fromWorldY + groupGap * (storming ? 0.55 : 1);
    for (var i = 0; i < numLines; i++) {
      barriers.push(makeBarrier(y));
      y += lineGap * (storming ? 0.6 : 1);
    }
    return y;
  }

  function makeBarrier(worldY){
    var fake = elapsed > 14 && Math.random() < 0.12;
    var color;
    if (lastBarrierColor === null) {
      color = Math.random() < 0.5 ? RED : BLUE;
    } else if (Math.random() < 0.72) {
      color = lastBarrierColor === RED ? BLUE : RED;
    } else {
      color = lastBarrierColor;
    }
    lastBarrierColor = color;
    return {
      worldY: worldY,
      color: color,
      passed: false,
      fake: fake,
      flipped: false,
      flipGlow: 0,
      h: Math.max(9, Math.min(14, W * 0.032))
    };
  }

  function triggerFail(){
    state = STATE_OVER;
    playFail();
    shakeT = 1;
    flashT = 1;
    var isNewBest = score > best;
    if (isNewBest) {
      best = score;
      try { localStorage.setItem('reflexColorBest', String(best)); } catch (e) {}
    }
    finalScore.textContent = score;
    bestVal2.textContent = best;
    bestVal.textContent = best;
    newBestTag.hidden = !isNewBest;
    setTimeout(function(){
      overScreen.hidden = false;
      requestAnimationFrame(function(){ overScreen.classList.remove('leaving'); });
    }, 320);
  }

  function update(dt){
    elapsed += dt;
    speed = speedForScore(score);
    scrollOffset += speed * dt;

    if (ball.switchT < 1) ball.switchT = Math.min(1, ball.switchT + dt * 7);

    var by = ballScreenY();

    for (var i = 0; i < barriers.length; i++) {
      var b = barriers[i];

      if (b.fake && !b.flipped) {
        var distToBall = b.worldY - scrollOffset;
        if (distToBall < 70 && distToBall > 0) {
          b.color = b.color === RED ? BLUE : RED;
          b.flipped = true;
          b.flipGlow = 1;
        }
      }
      if (b.flipGlow > 0) b.flipGlow = Math.max(0, b.flipGlow - dt * 3);

      if (!b.passed && b.worldY <= scrollOffset + ball.radius * 0.4) {
        b.passed = true;
        if (b.color === ball.color) {
          score++;
          scoreVal.textContent = score;
          playPass();
          var coinTarget = Math.floor(score / 2);
          if (coinTarget > coinsAwardedThisRun) {
            coinsAwardedThisRun = coinTarget;
            awardCoin();
          }
          if (score >= stormNextScore) {
            stormGroupsLeft = 3;
            stormNextScore += 12;
            pressureBanner.classList.add('show');
            setTimeout(function(){ pressureBanner.classList.remove('show'); }, 1100);
          }
        } else {
          triggerFail();
        }
      }
    }

    barriers = barriers.filter(function(b){ return b.worldY > scrollOffset - 80; });

    var maxWorldY = 0;
    for (var j = 0; j < barriers.length; j++) maxWorldY = Math.max(maxWorldY, barriers[j].worldY);
    if (maxWorldY === 0) maxWorldY = by + scrollOffset;
    if (maxWorldY - scrollOffset < H * 1.4) {
      spawnGroup(maxWorldY);
    }

    if (shakeT > 0) shakeT = Math.max(0, shakeT - dt * 1.8);
    if (flashT > 0) {
      flashT = Math.max(0, flashT - dt * 2.2);
      flashEl.style.opacity = (flashT * 0.5).toFixed(3);
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0d0d10');
    g.addColorStop(1, '#050506');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shakeT > 0) {
      var mag = shakeT * 6;
      ctx.translate(rand(-mag, mag), rand(-mag, mag));
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    for (var i = 0; i < bgStreaks.length; i++) {
      var st = bgStreaks[i];
      var sy = ((st.worldY - scrollOffset * 0.6) % (H + 200) + (H + 200)) % (H + 200) - 100;
      ctx.beginPath();
      ctx.moveTo(st.x, sy);
      ctx.lineTo(st.x, sy + st.len);
      ctx.stroke();
    }

    var by = ballScreenY();
    for (var k = 0; k < barriers.length; k++) {
      var b = barriers[k];
      var y = by + (b.worldY - scrollOffset);
      if (y < -30 || y > H + 30) continue;
      drawBarrier(b, y);
    }

    drawBall(ball.x, by);

    ctx.restore();
  }

  function drawBarrier(b, y){
    var h = b.h;
    ctx.fillStyle = COLOR_HEX[b.color];
    ctx.fillRect(0, y - h / 2, W, h);
    ctx.lineWidth = 1;
    ctx.strokeStyle = STROKE_HEX[b.color];
    ctx.strokeRect(0, y - h / 2, W, h);
    if (b.flipGlow > 0) {
      ctx.save();
      ctx.globalAlpha = b.flipGlow * 0.8;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.strokeRect(0, y - h / 2 - 2, W, h + 4);
      ctx.restore();
    }
  }

  function drawBall(x, y){
    var r = ball.radius;

    ctx.save();
    ctx.translate(x, y);

    if (currentPattern === 'basketball' || currentPattern === 'creeper') {
      ctx.beginPath();
      ctx.ellipse(0, r * 0.95, r * 0.85, r * 0.26, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.32)';
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.9, 0, Math.PI * 2);
      var glow = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 1.9);
      glow.addColorStop(0, COLOR_GLOW[ball.color]);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fill();
    }

    if (currentPattern === 'basketball' && basketballPixelsReady) {
      var bbSrc = (ball.color === BLUE) ? basketballPixelBlack : basketballPixelOrange;
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(bbSrc, -r, -r, r * 2, r * 2);
      ctx.imageSmoothingEnabled = true;
      ctx.restore();
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.stroke();
    } else if (currentPattern === 'creeper') {
      var crSrc = (ball.color === BLUE) ? creeperPixelBlue : creeperPixelRed;
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(crSrc, -r, -r, r * 2, r * 2);
      ctx.imageSmoothingEnabled = true;
      ctx.restore();
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = COLOR_HEX[ball.color];
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = STROKE_HEX[ball.color];
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop(ts){
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.033, (ts - lastTs) / 1000);
    lastTs = ts;

    if (state === STATE_PLAY) update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  function startGame(){
    ensureAudio();
    resize();
    initGameReal();
    state = STATE_PLAY;
    startScreen.classList.add('leaving');
    setTimeout(function(){ startScreen.hidden = true; startScreen.classList.remove('leaving'); }, 350);
  }

  function retryGame(){
    ensureAudio();
    resize();
    initGameReal();
    state = STATE_PLAY;
    overScreen.classList.add('leaving');
    setTimeout(function(){ overScreen.hidden = true; overScreen.classList.remove('leaving'); }, 350);
  }

  function goToMenu(){
    state = STATE_START;
    scoreVal.textContent = '0';
    overScreen.classList.add('leaving');
    setTimeout(function(){
      overScreen.hidden = true;
      overScreen.classList.remove('leaving');
      startScreen.hidden = false;
      startScreen.classList.add('leaving');
      requestAnimationFrame(function(){ startScreen.classList.remove('leaving'); });
    }, 350);
  }

  function goToSkins(){
    renderSkinList();
    skinsCoinVal.textContent = coins;
    startScreen.classList.add('leaving');
    setTimeout(function(){
      startScreen.hidden = true;
      startScreen.classList.remove('leaving');
      skinsScreen.hidden = false;
      skinsScreen.classList.add('leaving');
      requestAnimationFrame(function(){ skinsScreen.classList.remove('leaving'); });
    }, 350);
  }

  function backToMenuFromSkins(){
    skinsScreen.classList.add('leaving');
    setTimeout(function(){
      skinsScreen.hidden = true;
      skinsScreen.classList.remove('leaving');
      startScreen.hidden = false;
      startScreen.classList.add('leaving');
      requestAnimationFrame(function(){ startScreen.classList.remove('leaving'); });
    }, 350);
  }

  function initGameReal(){
    ball = { x: W / 2, color: RED, switchT: 1, radius: Math.max(14, Math.min(22, W * 0.05)) };
    barriers = [];
    scrollOffset = 0;
    elapsed = 0;
    score = 0;
    speed = SPEED_BASE;
    stormGroupsLeft = 0;
    stormNextScore = 12;
    shakeT = 0;
    flashT = 0;
    flashEl.style.opacity = 0;
    scoreVal.textContent = '0';
    lastBarrierColor = null;
    coinsAwardedThisRun = 0;

    bgStreaks = [];
    for (var i = 0; i < 18; i++) {
      bgStreaks.push({ x: rand(0, W), worldY: rand(0, 2000), len: rand(14, 40) });
    }

    spawnGroup(ballScreenY() + 380);
  }

  function toggleColor(){
    if (state !== STATE_PLAY) return;
    ball.color = ball.color === RED ? BLUE : RED;
    ball.switchT = 0;
    playSwitch();
  }

  phone.addEventListener('pointerdown', function(e){
    if (state === STATE_PLAY) {
      toggleColor();
    }
  });

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });
  retryBtn.addEventListener('click', function(e){
    e.stopPropagation();
    retryGame();
  });
  menuBtn.addEventListener('click', function(e){
    e.stopPropagation();
    goToMenu();
  });
  skinsBtn.addEventListener('click', function(e){
    e.stopPropagation();
    goToSkins();
  });
  skinsBackBtn.addEventListener('click', function(e){
    e.stopPropagation();
    backToMenuFromSkins();
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
